<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المحلل الذكي الخارق للـ مقاطع والصور</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151d30;
            --accent-color: #00ff66;
            --text-color: #ffffff;
            --danger-color: #ff3366;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: var(--accent-color);
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.3);
        }

        .main-box {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 15px;
            border: 1px solid #22314d;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        input[type="file"], input[type="text"] {
            width: 100%;
            padding: 12px;
            background: #0b0f19;
            border: 2px solid #22314d;
            border-radius: 8px;
            color: #fff;
            box-sizing: border-box;
            margin-bottom: 15px;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
            outline: none;
        }

        button {
            background: var(--accent-color);
            color: #000;
            border: none;
            padding: 12px 25px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #00cc52;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.4);
        }

        .btn-danger {
            background: var(--danger-color);
            color: white;
        }
        .btn-danger:hover { background: #cc0044; }

        video {
            width: 100%;
            max-height: 400px;
            border-radius: 8px;
            background: #000;
            margin-top: 15px;
        }

        .gallery-title {
            margin-top: 30px;
            color: var(--accent-color);
            border-bottom: 2px solid #22314d;
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .img-card {
            background: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #22314d;
            transition: transform 0.2s;
        }

        .img-card:hover {
            transform: translateY(-5px);
        }

        .img-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
            background: #000;
        }

        .card-details {
            padding: 15px;
            font-size: 14px;
        }

        .card-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .card-actions a, .card-actions button {
            flex: 1;
            text-align: center;
            padding: 8px;
            font-size: 12px;
            text-decoration: none;
            border-radius: 5px;
        }

        .btn-raw {
            background: #3388ff;
            color: white;
        }

        .url-preview-box {
            text-align: center;
            padding: 20px;
            background: #0b0f19;
            border-radius: 10px;
            margin-top: 15px;
        }

        .url-preview-box img {
            max-width: 100%;
            max-height: 300px;
            border: 2px solid var(--accent-color);
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>النظام الذكي المتطور لتحليل الفيديو والروابط</h1>

    <!-- القسم الأول: رفع الفيديو وتقطيعه -->
    <div class="main-box">
        <h3>1. نظام سحب مقاطع الفيديو وتفكيكها ثانية بثانية (مضاد للتشويش)</h3>
        <input type="file" id="videoInput" accept="video/*">
        <video id="mainVideo" controls style="display:none;"></video>
        <canvas id="conversionCanvas" style="display:none;"></canvas>
    </div>

    <!-- القسم الثاني: جلب الصور من الروابط -->
    <div class="main-box">
        <h3>2. نظام جلب الصور من الروابط الذكية</h3>
        <input type="text" id="urlInput" placeholder="أدخل رابط الصورة أو أي رابط يحتوي على صورة هنا...">
        <button onclick="fetchImageFromUrl()">استخراج ومعاينة الصورة</button>
        
        <div id="urlPreviewArea" class="url-preview-box" style="display: none;">
            <h4>هذه هي الصورة المستخرجة:</h4>
            <img id="previewTarget" src="" alt="المعاينة">
            <div style="margin-top: 10px;">
                <button onclick="downloadSingleImage(document.getElementById('previewTarget').src, 'url-image.png')">حفظ هذه الصورة في ألبومك</button>
            </div>
        </div>
    </div>

    <!-- معرض اللقطات الناتجة -->
    <div class="gallery-title">
        <h2>اللقطات المرصودة بدقة (ثانية بثانية)</h2>
        <button class="btn-danger" id="downloadAllBtn" style="display:none;" onclick="downloadAllImages()">حفظ كل الصور دفعة واحدة في جهازك</button>
    </div>

    <div class="grid-container" id="gallery">
        <!-- الصور المقطعة بتنزل هنا تلقائياً -->
    </div>
</div>

<script>
    const videoInput = document.getElementById('videoInput');
    const video = document.getElementById('mainVideo');
    const canvas = document.getElementById('conversionCanvas');
    const ctx = canvas.getContext('2d');
    const gallery = document.getElementById('gallery');
    const downloadAllBtn = document.getElementById('downloadAllBtn');

    let processedImages = [];
    let lastFrameData = null;

    videoInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const fileURL = URL.createObjectURL(file);
        video.src = fileURL;
        video.style.display = 'block';
        gallery.innerHTML = '';
        processedImages = [];
        downloadAllBtn.style.display = 'none';
        
        video.onloadedmetadata = function() {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            // بدء التقطيع الذكي ثانية بثانية
            extractFrames();
        };
    });

    async function extractFrames() {
        let duration = video.duration;
        let currentTime = 0;

        for (let i = 0; currentTime < duration; i++) {
            video.currentTime = currentTime;
            await new Promise(r => video.onseeked = r);

            // رسم اللقطة الحالية على الكانفاس لتوليد الصورة البديلة
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // نظام رصد ومنع التشويش الذكي الذكي (Anti-Blur / Noise Check)
            let frameData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            if (isFrameBlurryOrNoise(frameData)) {
                // تخطي اللقطة إذا رصد النظام تشويش عالي مقارنة بالسابقة
                currentTime += 1;
                continue; 
            }

            let dataUrl = canvas.toDataURL('image/png');
            processedImages.push({
                src: dataUrl,
                second: currentTime.toFixed(1),
                index: i + 1
            });

            createCard(dataUrl, currentTime.toFixed(1), i + 1);
            currentTime += 1; // الانتقال للثانية التالية بالتمام
        }

        if(processedImages.length > 0) {
            downloadAllBtn.style.display = 'block';
        }
    }

    // خوارزمية ذكية لمقارنة التشويش الفجائي بين اللقطات
    function isFrameBlurryOrNoise(currentFrame) {
        if (!lastFrameData) {
            lastFrameData = currentFrame;
            return false;
        }
        let data1 = lastFrameData.data;
        let data2 = currentFrame.data;
        let diff = 0;
        
        // فحص عينة من البيكسلات لتسريع الأداء البرمجي
        for (let i = 0; i < data1.length; i += 40) {
            diff += Math.abs(data1[i] - data2[i]); // قياس الفارق في اللون الأحمر كمؤشر
        }
        
        lastFrameData = currentFrame;
        // إذا الفارق هائل ومفاجئ جداً (يدل على تشويش أو وميض تالف)
        return diff > 50000000; 
    }

    // بناء كارت الصورة مع الأزرار ورابط الـ RAW المطلوب
    function createCard(src, second, count) {
        const card = document.createElement('div');
        card.className = 'img-card';

        // محاكاة رابط الـ raw المحفوظ بآخر المسار تلقائياً بناءً على طلبك
        let rawFakeUrl = window.location.href + `generated-frames/snapshot-${count}-time-${second}s/raw/`;

        card.innerHTML = `
            <img src="${src}" alt="اللقطة ${count}">
            <div class="card-details">
                <strong>اللقطة رقم:</strong> ${count} <br>
                <strong>توقيت اللقطة:</strong> ثانية ${second} <br>
                <div class="card-actions">
                    <button onclick="downloadSingleImage('${src}', 'snapshot-${second}s.png')">حفظ بالمسار</button>
                    <a href="${src}" target="_blank" class="btn-raw" onclick="saveRawLink('${rawFakeUrl}')">RAW /</a>
                </div>
            </div>
        `;
        gallery.appendChild(card);
    }

    // حفظ الرابط تلقائياً عند الدخول على الـ RAW
    function saveRawLink(url) {
        console.log("تم حفظ الرابط الذكي في الذاكرة بنجاح:", url);
        alert("رابط الـ RAW المفصل لهذه اللقطة هو:\n" + url + "\n\nتم حفظ مسار الرابط تلقائياً!");
    }

    // دالة حفظ صورة واحدة مباشرة إلى ألبوم الجهاز بالـ Downloads
    function downloadSingleImage(src, filename) {
        const link = document.createElement('a');
        link.href = src;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    // دالة خارقة لحفظ كل الصور في جهازك بضغطة زر واحدة دفعة واحدة
    function downloadAllImages() {
        if(processedImages.length === 0) return;
        
        processedImages.forEach((imgObj) => {
            downloadSingleImage(imgObj.src, `تفكيك-تلقائي-لقطة-${imgObj.index}-ثانية-${imgObj.second}.png`);
        });
    }

    // نظام جلب وتصفية الروابط وعرضها في المربع السفلي
    function fetchImageFromUrl() {
        const urlInput = document.getElementById('urlInput').value;
        const previewArea = document.getElementById('urlPreviewArea');
        const previewTarget = document.getElementById('previewTarget');

        if(!urlInput) {
            alert("ارجوك ضع رابطاً أولاً!");
            return;
        }

        // إظهار المربع وتحميل الصورة داخله
        previewArea.style.display = 'block';
        previewTarget.src = urlInput;

        previewTarget.onerror = function() {
            // حل بديل إذا كان الرابط الخارجي محمي ضد الـ CORS
            alert("تم رصد الرابط! في حال لم تظهر الصورة مباشرة، تأكد أن الرابط مباشر وينتهي بامتداد صور مثل png أو jpg.");
        };
    }
</script>

</body>
</html>
