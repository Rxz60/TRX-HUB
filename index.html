<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستخرج اللقطات · كل ثانية</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0b1120;
            color: #e2e8f0;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            padding: 24px 16px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }
        .app {
            max-width: 1100px;
            width: 100%;
        }
        header {
            background: #1e293b;
            padding: 24px 20px;
            border-radius: 20px;
            border: 1px solid #334155;
            margin-bottom: 28px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        header h1 {
            font-weight: 600;
            font-size: 1.9rem;
            letter-spacing: 0.5px;
            color: #60a5fa;
        }
        header p {
            color: #94a3b8;
            margin-top: 6px;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 24px 20px;
            margin-bottom: 30px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }
        .card-title {
            font-size: 1.5rem;
            font-weight: 500;
            border-bottom: 2px solid #334155;
            padding-bottom: 12px;
            margin-bottom: 20px;
            color: #f1f5f9;
        }
        .upload-label {
            display: inline-block;
            background: #2563eb;
            color: white;
            font-weight: 600;
            padding: 12px 28px;
            border-radius: 40px;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 1rem;
            border: none;
        }
        .upload-label:hover {
            background: #1d4ed8;
        }
        input[type="file"] { display: none; }
        #videoPreview {
            width: 100%;
            max-height: 360px;
            background: #0f172a;
            border-radius: 16px;
            margin: 20px 0 12px;
            border: 1px solid #334155;
            display: none;
        }
        .status-badge {
            color: #38bdf8;
            font-weight: 500;
            margin: 6px 0 16px;
            padding: 8px 0;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 18px;
            margin-top: 22px;
        }
        .frame-card {
            background: #0f172a;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid #334155;
            transition: 0.1s;
            display: flex;
            flex-direction: column;
        }
        .frame-card img {
            width: 100%;
            display: block;
            aspect-ratio: 16/9;
            object-fit: cover;
            background: #020617;
        }
        .frame-meta {
            padding: 10px 8px 8px;
            font-size: 0.85rem;
            text-align: center;
            color: #cbd5e1;
            background: #0f172a;
        }
        .save-btn {
            background: #2563eb;
            border: none;
            color: white;
            font-weight: 600;
            padding: 10px 0;
            width: 100%;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.15s;
            border-radius: 0 0 14px 14px;
        }
        .save-btn:hover {
            background: #1d4ed8;
        }
        .url-section {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }
        .url-section input {
            flex: 2 1 240px;
            background: #0f172a;
            border: 1px solid #334155;
            padding: 14px 18px;
            border-radius: 40px;
            color: #f8fafc;
            font-size: 1rem;
        }
        .url-section input::placeholder {
            color: #64748b;
        }
        .action-btn {
            background: #0ea5e9;
            border: none;
            color: white;
            font-weight: 600;
            padding: 14px 32px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
            flex: 1 0 auto;
        }
        .action-btn:hover {
            background: #0284c7;
        }
        .url-image-box {
            margin-top: 24px;
            background: #0f172a;
            border-radius: 18px;
            padding: 20px;
            border: 1px solid #334155;
            display: none;
            text-align: center;
        }
        .url-image-box img {
            max-width: 100%;
            max-height: 420px;
            border-radius: 12px;
            margin-bottom: 12px;
            border: 1px solid #2d3a4f;
        }
        .url-save-btn {
            background: #10b981;
            border: none;
            color: white;
            font-weight: 600;
            padding: 12px 28px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.15s;
        }
        .url-save-btn:hover {
            background: #059669;
        }
        .raw-hint {
            color: #64748b;
            font-size: 0.9rem;
            margin-top: 16px;
            border-top: 1px dashed #2d3a4f;
            padding-top: 14px;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="app">
    <header>
        <h1>⏱️ مستخرج اللقطات · كل ثانية</h1>
        <p>رفع فيديو ← استخراج صورة لكل ثانية + حفظ مباشر · رابط خارجي</p>
    </header>

    <!-- قسم الفيديو -->
    <div class="card">
        <div class="card-title">🎞️ تفكيك الفيديو (صورة/ثانية)</div>
        <label for="videoInput" class="upload-label">⬆️ اختر فيديو من جهازك</label>
        <input type="file" id="videoInput" accept="video/*">
        <video id="videoPreview" controls></video>
        <div id="processStatus" class="status-badge"></div>
        <div class="gallery" id="videoGallery"></div>
    </div>

    <!-- قسم الرابط -->
    <div class="card">
        <div class="card-title">🔗 جلب صورة من رابط</div>
        <div class="url-section">
            <input type="text" id="imageUrlInput" placeholder="https://example.com/image.jpg">
            <button class="action-btn" id="fetchUrlBtn">عرض + حفظ</button>
        </div>
        <div class="url-image-box" id="urlImageBlock">
            <img id="targetUrlImage" src="" alt="الصورة المستوردة">
            <button class="url-save-btn" id="downloadUrlImgBtn">💾 حفظ الصورة في جهازك</button>
        </div>
    </div>

    <div class="raw-hint">· RAW · لا إضافات · كل ثانية تُصوَّر · حفظ فوري</div>
</div>

<!-- كانفاس خفي للاستخراج -->
<canvas id="conversionCanvas" style="display:none;"></canvas>

<script>
    (function() {
        // عناصر الفيديو
        const videoInput = document.getElementById('videoInput');
        const videoPreview = document.getElementById('videoPreview');
        const videoGallery = document.getElementById('videoGallery');
        const processStatus = document.getElementById('processStatus');
        const canvas = document.getElementById('conversionCanvas');
        const ctx = canvas.getContext('2d');

        // عناصر الرابط
        const imageUrlInput = document.getElementById('imageUrlInput');
        const fetchUrlBtn = document.getElementById('fetchUrlBtn');
        const urlImageBlock = document.getElementById('urlImageBlock');
        const targetUrlImage = document.getElementById('targetUrlImage');
        const downloadUrlImgBtn = document.getElementById('downloadUrlImgBtn');

        // ----- معالج الفيديو (كل ثانية) -----
        videoInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            // إعادة ضبط
            videoGallery.innerHTML = '';
            processStatus.innerText = '⏳ جاري تحميل الفيديو...';

            const fileURL = URL.createObjectURL(file);
            videoPreview.src = fileURL;
            videoPreview.style.display = 'block';
            videoPreview.load();

            videoPreview.onloadedmetadata = function() {
                const duration = Math.floor(videoPreview.duration);
                if (duration <= 0) {
                    processStatus.innerText = '⚠️ المدة غير صالحة';
                    return;
                }

                canvas.width = videoPreview.videoWidth || 640;
                canvas.height = videoPreview.videoHeight || 360;
                processStatus.innerText = `⏳ استخراج ${duration} لقطة ...`;

                let currentSecond = 0;
                let isProcessing = true;

                // دالة استخراج متسلسلة (بدون setInterval)
                function extractNext() {
                    if (!isProcessing || currentSecond > duration) {
                        processStatus.innerText = `✅ اكتمل استخراج ${duration} لقطة`;
                        isProcessing = false;
                        return;
                    }

                    // ضبط الوقت
                    videoPreview.currentTime = currentSecond;
                }

                videoPreview.onseeked = function() {
                    if (!isProcessing) return;
                    if (currentSecond > duration) {
                        processStatus.innerText = `✅ اكتمل (${duration} لقطة)`;
                        isProcessing = false;
                        return;
                    }

                    // رسم الإطار على الكانفاس
                    ctx.drawImage(videoPreview, 0, 0, canvas.width, canvas.height);
                    const dataURL = canvas.toDataURL('image/jpeg', 0.92);

                    // إنشاء بطاقة الصورة
                    const card = document.createElement('div');
                    card.className = 'frame-card';

                    const img = document.createElement('img');
                    img.src = dataURL;
                    img.alt = `frame-${currentSecond}`;

                    const meta = document.createElement('div');
                    meta.className = 'frame-meta';
                    meta.innerText = `⏱️ ${currentSecond} ث`;

                    const saveBtn = document.createElement('button');
                    saveBtn.className = 'save-btn';
                    saveBtn.innerText = '💾 حفظ';
                    saveBtn.onclick = function(e) {
                        e.stopPropagation();
                        const a = document.createElement('a');
                        a.href = dataURL;
                        a.download = `frame_${currentSecond}s.jpg`;
                        a.click();
                    };

                    card.appendChild(img);
                    card.appendChild(meta);
                    card.appendChild(saveBtn);
                    videoGallery.appendChild(card);

                    // الانتقال للثانية التالية
                    currentSecond++;
                    if (currentSecond <= duration) {
                        videoPreview.currentTime = currentSecond;
                    } else {
                        processStatus.innerText = `✅ اكتمل (${duration} لقطة)`;
                        isProcessing = false;
                    }
                };

                // بدء الاستخراج من الثانية 0
                currentSecond = 0;
                videoPreview.currentTime = 0;
            };

            // في حال خطأ
            videoPreview.onerror = function() {
                processStatus.innerText = '❌ تعذر معالجة الفيديو';
            };
        });

        // ----- جلب الصورة من الرابط (مع حفظ) -----
        fetchUrlBtn.addEventListener('click', fetchImageFromUrl);

        function fetchImageFromUrl() {
            const url = imageUrlInput.value.trim();
            if (!url) {
                alert('الرجاء إدخال رابط صورة صحيح');
                return;
            }

            // عرض الصورة مباشرة (قد تظهر في حال السماح)
            targetUrlImage.src = url;
            urlImageBlock.style.display = 'block';

            // تحميل وحفظ الصورة عبر fetch + blob (مع الاحتياط)
            downloadUrlImgBtn.onclick = async function() {
                try {
                    const response = await fetch(url, { mode: 'cors' });
                    if (!response.ok) throw new Error('فشل التحميل');
                    const blob = await response.blob();
                    const blobUrl = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = blobUrl;
                    a.download = `image_${Date.now()}.jpg`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(blobUrl);
                } catch (_) {
                    // البديل: فتح الصورة في تبويب جديد مع محاولة الحفظ
                    const a = document.createElement('a');
                    a.href = url;
                    a.target = '_blank';
                    a.download = 'image.jpg';
                    a.click();
                }
            };

            // في حال فشل تحميل الصورة يعطي إنذار
            targetUrlImage.onerror = function() {
                alert('⚠️ تعذر عرض الصورة من الرابط (قد يكون الرابط غير مباشر أو محمي)');
            };
        }
    })();
</script>
</body>
</html>
